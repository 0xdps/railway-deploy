version: 2

# Theme selection is handled in docs/conf.py via the DOCS_THEME environment
# variable. For hosted Read the Docs builds, set DOCS_THEME in:
# Read the Docs Admin -> Environment Variables.
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt
